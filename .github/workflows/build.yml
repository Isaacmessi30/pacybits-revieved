name: Client build and backend checks
on:
  push:
    branches: [main, test63-completion-message-fix]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revival-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix backend test
      - run: node --test backend/integration/http.test.js backend/integration/trading-flow.test.js
  ios-client:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Developer tools
        run: xcodebuild -version
      - name: Portable client checks
        run: bash scripts/check-client.sh
      - name: XCTest suite
        run: swift test --package-path client
      - name: Compile unsigned iPhone client library
        run: bash scripts/build-ios-client.sh
      - name: Compile original-screen bootstrap dylib and sender island
        run: bash scripts/build-bootstrap.sh
      - name: Compile Google login coordinator with iPhone SDK
        working-directory: client/ios
        run: >-
          xcodebuild -scheme RevivalGoogleLogin -destination 'generic/platform=iOS'
          -derivedDataPath ../../build/google-login
          CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-original-trading-bootstrap
          path: |
            build/bootstrap/RevivalBootstrap.dylib
            build/bootstrap/LegacySendIsland.o
            build/bootstrap/SHA256.txt
          if-no-files-found: error
          retention-days: 7
